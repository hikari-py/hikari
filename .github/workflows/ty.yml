name: Ty

on:
  pull_request:
    branches:
      - master

jobs:
  ty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          activate-environment: true

      - name: Install nox
        run: |
          uv sync --frozen --only-group nox

      - name: Ty
        run: |
          set -o pipefail
          nox -s ty 2>&1 | tee ty-output.log

      - name: Report
        if: always() && !cancelled()
        run: |
          {
            echo "### ty results"
            echo
            echo '```'
            cat ty-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
